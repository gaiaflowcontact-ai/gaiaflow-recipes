<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3f5a3c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%233f5a3c%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2252%22 text-anchor=%22middle%22 fill=%22white%22%3EG%3C/text%3E%3C/svg%3E">
<title>Gaia Flow 配料食譜</title>
<style>
:root{
  --bg:#f6f3ec; --card:#fffdf8; --ink:#2b2a26; --muted:#7a766b; --line:#e4ded0;
  --green:#3f5a3c; --green-soft:#e6ede2;
  --cold:#2f6f9f; --cold-soft:#e3eef6;
  --hot:#b5532a; --hot-soft:#f7e6dc;
  --sweet:#7b4b94; --sweet-soft:#efe6f4;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%;}
button,input{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-size:19px;margin:0;letter-spacing:.04em;color:var(--green)}
.brand small{color:var(--muted);font-size:12px}
.search{margin-top:10px;width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:16px}
.tab[data-s="冷台"].on{background:var(--cold);border-color:var(--cold);color:#fff}
.tab[data-s="熱台"].on{background:var(--hot);border-color:var(--hot);color:#fff}
.tab[data-s="甜點"].on{background:var(--sweet);border-color:var(--sweet);color:#fff}
h2.sec{font-size:14px;color:var(--muted);margin:20px 2px 8px;font-weight:600;letter-spacing:.08em}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{display:block;color:inherit;text-decoration:none;text-align:left;padding:12px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);cursor:pointer}
.item b{display:block;font-size:16px;line-height:1.3}
.item span{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.item .nostep{color:#b08a3c}
.empty{color:var(--muted);padding:24px 4px;text-align:center}
/* recipe page */
.back{border:none;background:none;color:var(--green);font-size:16px;padding:6px 0;font-weight:600}
.rhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:4px 0 0}
.rhead h1{font-size:22px;margin:0;line-height:1.25}
.rid{color:var(--muted);font-size:13px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip.c{background:var(--cold-soft);color:var(--cold)}
.chip.h{background:var(--hot-soft);color:var(--hot)}
.chip.s{background:var(--sweet-soft);color:var(--sweet)}
.meta{color:var(--muted);font-size:13px}
.scaler{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:4px;margin:10px -16px 10px;padding:8px 16px;background:var(--green-soft);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.scaler::-webkit-scrollbar{display:none}
.sg{display:flex;align-items:center;gap:3px;font-size:14px;font-weight:600;color:var(--green);flex:none}
.sg input::-webkit-inner-spin-button,.sg input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sg input{-moz-appearance:textfield;appearance:textfield;padding:6px 5px;border-radius:8px;border:1px solid #c9d6c3;font-size:16px;font-weight:700;text-align:right;background:#fff}
#tg{width:66px}#mul{width:42px}
.quick{display:flex;gap:2px;flex:none}
.quick button{padding:6px 6px;border-radius:99px;border:1px solid #c9d6c3;background:#fff;font-size:13px;line-height:1}
.quick button.on{background:var(--green);color:#fff;border-color:var(--green)}
table.ing{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
table.ing th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
table.ing th:first-child,table.ing td:first-child{text-align:left}
table.ing td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
table.ing tr:last-child td{border-bottom:none}
table.ing td.amt{font-size:20px;font-weight:700;white-space:nowrap}
table.ing td.amt small{font-size:13px;font-weight:600;margin-left:2px}
table.ing td.pct,table.ing td.orig{color:var(--muted);font-size:13px;white-space:nowrap}
table.ing tr.done td{opacity:.35;text-decoration:line-through}
.iname{font-size:16px;line-height:1.35}
.iname a{color:var(--green);font-weight:600}
.tot td{font-weight:700;background:#faf7ef}
.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
.steps{margin-top:18px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.steps h3{margin:0 0 8px;font-size:15px;color:var(--green)}
.steps pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:16px;line-height:1.7}
.steps .none{color:var(--muted)}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px}
.tools button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px}
.tools button.on{background:var(--green);color:#fff;border-color:var(--green)}
/* lock */
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lock .box{width:100%;max-width:340px;text-align:center}
.lock h1{color:var(--green);font-size:22px;margin:0 0 4px}
.lock p{color:var(--muted);font-size:14px;margin:0 0 18px}
.pad{position:relative;width:280px;height:280px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.pad svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pad .dot{fill:#cfc8b6;transition:r .12s}
.pad .dot.on{fill:var(--green)}
.pad .ring{fill:none;stroke:var(--green);stroke-width:2;opacity:0}
.pad .ring.on{opacity:.35}
.pad polyline,.pad line{stroke:var(--green);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.55}
.pad.bad .dot.on{fill:#b3261e}.pad.bad .ring.on{stroke:#b3261e}.pad.bad polyline{stroke:#b3261e}
.pad.bad{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lock .busy{color:var(--muted);font-size:14px;min-height:20px;margin-top:6px}
.lock .err{color:#b3261e;font-size:14px;min-height:20px;margin-top:10px}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:12px}
.foot button{border:none;background:none;color:var(--muted);text-decoration:underline;font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const $app = document.getElementById("app");
const KEY_PW = "gf-recipe-pw";
const KEY_TAB = "gf-recipe-tab";
let DATA = null;
let state = { tab: "冷台", q: "" };
try { state.tab = localStorage.getItem(KEY_TAB) || "冷台"; } catch (e) {}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} },
                set(k,v){ try{localStorage.setItem(k,v)}catch(e){} },
                del(k){ try{localStorage.removeItem(k)}catch(e){} } };

async function decrypt(enc, pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

let ENC = null;
async function loadEnc() {
  if (ENC) return ENC;
  const res = await fetch("data/recipes.enc.json?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("讀不到資料");
  ENC = await res.json();
  return ENC;
}

function showLock(msg) {
  const P = [], C = 280 / 3;
  for (let i = 0; i < 9; i++) P.push({ x: C * (i % 3) + C / 2, y: C * Math.floor(i / 3) + C / 2 });
  $app.innerHTML = `<div class="lock"><div class="box">
    <h1>Gaia Flow 配料食譜</h1><p>請畫出解鎖圖案</p>
    <div class="pad" id="pad"><svg viewBox="0 0 280 280">
      <polyline id="pl" points=""/><line id="tail" x1="0" y1="0" x2="0" y2="0" style="display:none"/>
      ${P.map((p, i) => `<circle class="ring" data-i="${i}" cx="${p.x}" cy="${p.y}" r="30"/><circle class="dot" data-i="${i}" cx="${p.x}" cy="${p.y}" r="10"/>`).join("")}
    </svg></div>
    <div class="err" id="err">${esc(msg || "")}</div></div></div>`;
  const pad = document.getElementById("pad"), pl = document.getElementById("pl"), tail = document.getElementById("tail");
  let seq = [], drawing = false, locked = false;
  const pos = e => { const r = pad.getBoundingClientRect(); return { x: (e.clientX - r.left) * 280 / r.width, y: (e.clientY - r.top) * 280 / r.height }; };
  const mark = i => {
    if (seq.includes(i)) return;
    const last = seq[seq.length - 1];
    if (last !== undefined) {           // 跨過中間的點時自動加上（跟手機一樣）
      const mid = (last + i) / 2, a = [last % 3, Math.floor(last / 3)], b = [i % 3, Math.floor(i / 3)];
      if (Number.isInteger(mid) && (a[0] + b[0]) % 2 === 0 && (a[1] + b[1]) % 2 === 0 && !seq.includes(mid)) mark(mid);
    }
    seq.push(i);
    pad.querySelectorAll(`[data-i="${i}"]`).forEach(c => c.classList.add("on"));
    pad.querySelector(`.dot[data-i="${i}"]`).setAttribute("r", 13);
    pl.setAttribute("points", seq.map(k => P[k].x + "," + P[k].y).join(" "));
    if (navigator.vibrate) navigator.vibrate(8);
  };
  const hit = p => P.findIndex(q => (q.x - p.x) ** 2 + (q.y - p.y) ** 2 < 34 * 34);
  const reset = () => {
    seq = []; pl.setAttribute("points", ""); tail.style.display = "none"; pad.classList.remove("bad");
    pad.querySelectorAll(".on").forEach(c => c.classList.remove("on"));
    pad.querySelectorAll(".dot").forEach(c => c.setAttribute("r", 10));
  };
  pad.addEventListener("pointerdown", e => {
    if (locked) return; reset(); drawing = true; pad.setPointerCapture(e.pointerId);
    const i = hit(pos(e)); if (i >= 0) mark(i);
  });
  pad.addEventListener("pointermove", e => {
    if (!drawing) return; const p = pos(e); const i = hit(p); if (i >= 0) mark(i);
    if (seq.length) { const l = P[seq[seq.length - 1]]; tail.style.display = ""; tail.setAttribute("x1", l.x); tail.setAttribute("y1", l.y); tail.setAttribute("x2", p.x); tail.setAttribute("y2", p.y); }
  });
  const finish = async () => {
    if (!drawing) return; drawing = false; tail.style.display = "none";
    if (seq.length < 4) { document.getElementById("err").textContent = seq.length ? "至少連 4 個點" : ""; setTimeout(reset, 500); return; }
    locked = true; document.getElementById("err").textContent = "解鎖中…";
    const ok = await unlock(seq.map(i => i + 1).join(""), true);
    if (!ok) {
      locked = false; pad.classList.add("bad");
      document.getElementById("err").textContent = "圖案不對，請再試一次";
      setTimeout(reset, 700);
    }
  };
  pad.addEventListener("pointerup", finish);
  pad.addEventListener("pointercancel", finish);
}

async function unlock(pw, fromPad) {
  try {
    const enc = await loadEnc();
    DATA = await decrypt(enc, pw);
    store.set(KEY_PW, pw);
    route();
    return true;
  } catch (e) {
    store.del(KEY_PW);
    if (!fromPad) showLock();
    else if (e.name !== "OperationError") { showLock("載入失敗：" + e.message); return true; }
    return false;
  }
}

const stationClass = s => ({ "冷台": "c", "熱台": "h", "甜點": "s" }[s] || "c");
const catLabel = c => c[0] === "甜點" ? "甜點" : c[0] + "・" + c[1];
const byId = id => DATA.recipes.find(r => r.id === id);

function card(r) {
  return `<a class="item" href="#${esc(r.id)}"><b>${esc(r.name)}</b><span>${esc(r.id)}${r.steps ? "" : ' · <span class="nostep" style="display:inline">做法待補</span>'}</span></a>`;
}

function showList() {
  const q = state.q.trim().toLowerCase();
  let body = "";
  if (q) {
    const hits = DATA.recipes.filter(r => (r.name + " " + r.id + " " + r.items.map(i => i.name).join(" ")).toLowerCase().includes(q));
    body = hits.length ? `<h2 class="sec">搜尋結果 ${hits.length} 個</h2><div class="list">${hits.map(card).join("")}</div>`
                       : `<div class="empty">找不到「${esc(state.q)}」</div>`;
  } else {
    const subs = DATA.stations[state.tab] || [];
    for (const sub of subs) {
      const rs = DATA.recipes.filter(r => r.cats.some(c => c[0] === state.tab && c[1] === sub));
      if (!rs.length) continue;
      body += (state.tab === "甜點" ? "" : `<h2 class="sec">${esc(sub)}</h2>`) + `<div class="list">${rs.map(card).join("")}</div>`;
    }
    if (!body) body = `<div class="empty">這一台還沒有配料</div>`;
  }
  $app.innerHTML = `<div class="wrap">
    <header class="top">
      <div class="brand"><h1>Gaia Flow 配料食譜</h1><small>${DATA.recipes.length} 個配料</small></div>
      <input class="search" id="q" type="search" placeholder="搜尋配料或材料…" value="${esc(state.q)}">
      <div class="tabs">${Object.keys(DATA.stations).map(s => `<button class="tab ${s === state.tab && !q ? "on" : ""}" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
    </header>
    <main>${body}</main>
    <div class="foot">資料更新：${esc(DATA.updated)}　<button id="logout">登出</button></div>
  </div>`;
  const qi = document.getElementById("q");
  qi.oninput = () => { state.q = qi.value; const pos = qi.selectionStart; showList(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); };
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { state.tab = b.dataset.s; state.q = ""; store.set(KEY_TAB, state.tab); showList(); window.scrollTo(0, 0); });
  document.getElementById("logout").onclick = () => { store.del(KEY_PW); DATA = null; showLock(); };
}

function fmt(g) {
  if (g == null || isNaN(g)) return "";
  if (g === 0) return "0";
  if (g < 10) return (Math.round(g * 10) / 10).toString();
  return Math.round(g).toLocaleString("en-US");
}

let wakeLock = null;
async function toggleWake(btn) {
  try {
    if (wakeLock) { await wakeLock.release(); wakeLock = null; btn.classList.remove("on"); btn.textContent = "螢幕保持亮著"; return; }
    wakeLock = await navigator.wakeLock.request("screen");
    btn.classList.add("on"); btn.textContent = "✓ 螢幕保持亮著";
    wakeLock.addEventListener("release", () => { wakeLock = null; btn.classList.remove("on"); btn.textContent = "螢幕保持亮著"; });
  } catch (e) { btn.textContent = "這支手機不支援"; }
}

function showRecipe(r) {
  const gItems = r.items.filter(i => i.g != null && (i.unit || "g").toLowerCase() === "g");
  const base = r.total || gItems.reduce((a, i) => a + i.g, 0) || 1;
  let target = base;
  const chips = r.cats.map(c => `<span class="chip ${stationClass(c[0])}">${esc(catLabel(c))}</span>`).join("");
  $app.innerHTML = `<div class="wrap">
    <header class="top" style="position:static;border:none;padding-bottom:0">
      <button class="back" id="back">‹ 返回</button>
    </header>
    <div class="rhead"><h1>${esc(r.name)}</h1>${chips}<span class="rid">${esc(r.id)}</span></div>
    <div class="scaler">
      <span class="sg"><input id="tg" type="number" inputmode="decimal" min="0" step="any" value="${Math.round(base * 10) / 10}">g</span>
      <span class="quick">${[0.5, 1, 2, 3, 4].map(m => `<button data-m="${m}" class="${m === 1 ? "on" : ""}">×${m}</button>`).join("")}</span>
      <span class="sg"><input id="mul" type="number" inputmode="decimal" min="0" step="any" value="1">倍</span>
    </div>
    <table class="ing"><thead><tr><th>材料</th><th>比例</th><th>原配方</th><th>換算</th></tr></thead><tbody id="tb"></tbody></table>
    <div class="hint">點一下材料可以劃掉（秤好的打勾用）</div>
    <div class="steps"><h3>做法</h3>${r.steps ? `<pre>${esc(r.steps)}</pre>` : `<div class="none">做法還沒補上。</div>`}</div>
    ${r.steps ? `<div class="hint">※ 做法是從紙本食譜複製的，裡面的克數可能是舊版；份量請以上面的表格為準。</div>` : ""}
    <div class="tools"><button id="wake">螢幕保持亮著</button><span class="meta">資料更新：${esc(DATA.updated)}</span></div>
  </div>`;
  const tb = document.getElementById("tb");
  const done = new Set();
  function draw() {
    const k = target / base;
    let rows = "";
    r.items.forEach((it, idx) => {
      const isG = it.g != null && (it.unit || "g").toLowerCase() === "g";
      const sub = it.id && /^PREP\d+$/i.test(it.id) ? byId(it.id.toUpperCase()) : null;
      const nm = it.name || "（未填名稱）";
      const name = sub ? `<a href="#${esc(sub.id)}">${esc(nm)} ›</a>` : esc(nm);
      const pct = isG ? (it.g / base * 100) : null;
      const amt = it.g == null ? "" : fmt(it.g * k);
      rows += `<tr data-i="${idx}" class="${done.has(idx) ? "done" : ""}"><td><div class="iname">${name}</div></td>
        <td class="pct">${pct == null ? "" : (pct < 1 ? pct.toFixed(2) : pct.toFixed(1)) + "%"}</td>
        <td class="orig">${it.g == null ? "" : fmt(it.g) + " " + esc(it.unit || "g")}</td>
        <td class="amt">${amt}${amt ? `<small>${esc(it.unit || "g")}</small>` : ""}</td></tr>`;
    });
    rows += `<tr class="tot"><td>合計</td><td class="pct">100%</td><td class="orig">${fmt(base)} g</td><td class="amt">${fmt(target)}<small>g</small></td></tr>`;
    tb.innerHTML = rows;
    tb.querySelectorAll("tr[data-i]").forEach(tr => tr.onclick = e => {
      if (e.target.closest("a")) return;
      const i = +tr.dataset.i; done.has(i) ? done.delete(i) : done.add(i); tr.classList.toggle("done");
    });
  }
  const tg = document.getElementById("tg");
  const quick = document.querySelectorAll(".quick button");
  const mul = document.getElementById("mul");
  const r2 = v => Math.round(v * 100) / 100;
  const sync = (from) => {
    if (from !== "tg") tg.value = Math.round(target * 10) / 10;
    if (from !== "mul") mul.value = r2(target / base);
    quick.forEach(b => b.classList.toggle("on", Math.abs(+b.dataset.m * base - target) < 0.01));
    draw();
  };
  [tg, mul].forEach(el => {          // 點進去就全選，直接打新數字取代
    let justFocused = false;
    el.addEventListener("focus", () => { justFocused = true; setTimeout(() => el.select(), 0); });
    el.addEventListener("pointerup", e => { if (justFocused) { e.preventDefault(); el.select(); justFocused = false; } });
  });
  tg.oninput = () => { const v = parseFloat(tg.value); target = v > 0 ? v : base; sync("tg"); };
  mul.oninput = () => { const v = parseFloat(mul.value); target = base * (v > 0 ? v : 1); sync("mul"); };
  quick.forEach(b => b.onclick = () => { target = base * +b.dataset.m; sync(); });
  document.getElementById("back").onclick = () => { if (navDepth > 0) history.back(); else location.hash = ""; };
  const wb = document.getElementById("wake");
  if (!("wakeLock" in navigator)) wb.style.display = "none"; else wb.onclick = () => toggleWake(wb);
  draw();
  window.scrollTo(0, 0);
}

let navDepth = 0;
function route() {
  if (!DATA) return;
  const id = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  const r = id && byId(id);
  if (r) showRecipe(r); else { navDepth = 0; showList(); }
}
window.addEventListener("hashchange", () => { if (location.hash.length > 1) navDepth++; route(); });
